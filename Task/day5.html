<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="check" placeholder="Enter the Age:">
    <button id="btn1">Check Age</button>
    <p id="para"></p>
    <script>
        let input=document.getElementById('check')
        let btn=document.getElementById('btn1')
        let p=document.getElementById('para')
        btn.addEventListener('click',()=>{
            let age=input.value
            age=Number(age)
            if(age>=18){
                p.innerHTML='Your Eligible'
            }
            else{
                p.innerHTML='Not Eligible'
            }
        })
    </script>
</body>
</html>
