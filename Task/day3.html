<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <p id="para">Lorem ipsum dolor sit amet consectetur adipisicing elit. Repudiandae, voluptas.</p>
        <button id="btn1">Change Color</button>
        <button id="btn2">Change Color</button>
    </div>
    
    <script>
        let pone=document.getElementById('para')
       
        let red=document.getElementById('btn1')
        let blue=document.getElementById('btn2')

        red.addEventListener('click',()=>{
            pone.style.color='red'
        })
        blue.addEventListener('click',()=>{
            pone.style.color='blue'
        })
    </script>
</body>
</html>
