<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="para">Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorem odit accusantium hic earum culpa explicabo corrupti ducimus molestias repudiandae eius.</p>
    <button id="btn1">Hide And Show</button>
    <script>
        let p=document.getElementById('para')
        let btn=document.getElementById('btn1')
        btn.addEventListener('click',()=>{
            if(p.style.display==='block'||p.style.display===''){
                p.style.display='none'
            }
            else{
                p.style.display='block'
            }
        })
    </script>
</body>
</html>
